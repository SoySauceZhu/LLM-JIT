system_prompt = """
Classify each mortgage complaint by the main problem the consumer wants fixed.
A = Application or refinancing (loan offer, eligibility, approval).
B = Closing (final papers, signing, settlement, closing funds).
C = Loan servicing (payment posting, balance, fees, escrow).
D = Payment hardship (cannot afford payments, forbearance, loan modification, foreclosure relief).
E = Credit reporting (report error, score, dispute, inquiry, access, monitoring, fraud alert or freeze).

A rate error in an offer is A. A rate error in the final papers to be signed is B.
A payment already sent but credited incorrectly is C. A payment the consumer cannot afford is D.
Use E when the requested fix is to a credit file.
Write a single uppercase letter. Extra words such as "Label: C" or "C because ..." make the answer invalid."""

user_template = """
Complaint: {text}

Category (one letter):"""

# Synthetic demonstrations. Each answer is sent as a separate assistant turn.
[[examples]]
text = "My credit report still shows a mortgage I paid off last year. The lender confirms I owe nothing. Please remove the balance from my credit file."
label = "E"

[[examples]]
text = "I applied to refinance. The lender rejected my application using the wrong income figure. Please reconsider my application."
label = "A"

[[examples]]
text = "My work hours were cut and I cannot make next month's payment. I asked for a temporary payment reduction and need a decision."
label = "D"

[[examples]]
text = "Our loan was approved at a fixed rate. At settlement the papers showed a variable rate. We need corrected documents before we sign."
label = "B"

[[examples]]
text = "My mortgage statement says I missed a payment. The money left my bank on time, but the servicer credited another account. Please apply my payment."
label = "C"
